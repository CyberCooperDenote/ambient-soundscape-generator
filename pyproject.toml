[project]
name = "ambient-soundscape-generator"
version = "0.6.3"
description = "AI ambient soundscape generator — prompt-to-audio pipeline for Windows desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ambient-soundscape-generator contributors" }]
keywords = ["ambient", "soundscape", "audio", "generative", "pipeline", "windows"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.4", "mypy>=1.10"]
cuda = ["onnxruntime-gpu>=1.17"]
asio = ["sounddevice[asio]>=0.4.6"]

[project.scripts]
asg = "soundscape_pipeline.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["soundscape_pipeline*", "ingest*", "processors*", "drivers*", "models*", "utils*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=soundscape_pipeline --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]